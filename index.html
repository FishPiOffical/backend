<!doctype html>
<html lang="zh-CN" data-theme="classic-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhythm 管理后台</title>
    <script>
      // 首屏挂载前同步应用上次选择的深浅色主题，避免页面闪烁
      ;(function () {
        try {
          var saved = localStorage.getItem('rhythm.admin.theme')
          if (saved === 'classic-dark' || saved === 'classic-light') {
            document.documentElement.dataset.theme = saved
          }
        } catch (e) {
          // 忽略本地存储受限环境异常，回退默认经典浅色主题
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
